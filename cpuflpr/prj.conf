CONFIG_MAIN_STACK_SIZE=1536

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG=y

# CPUAPP and CPUFLPR share the same board UART on this target.
# Keep the remote core silent so the host core demo logs remain readable.
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n

CONFIG_DEMO_PAYLOAD_SIZE=32
CONFIG_DEMO_JOB_COUNT=100000
CONFIG_DEMO_PROGRESS_INTERVAL=10000
